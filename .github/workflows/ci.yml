name: Build and Push Go Image

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  IMAGE_NAME: gostage

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Build Docker image
        run: docker build -t ${{ env.IMAGE_NAME }} .

      - name: Smoke-test the image
        run: |
          docker run --rm -d -p 8081:8080 --name gostage-test ${{ env.IMAGE_NAME }}
          sleep 2
          curl -f http://localhost:8081/ || exit 1
          docker stop gostage-test

      - name: Tag and push to GHCR
        run: |
          docker tag ${{ env.IMAGE_NAME }} ghcr.io/${{ github.repository }}:latest
          docker tag ${{ env.IMAGE_NAME }} ghcr.io/${{ github.repository }}:${{ github.sha }}
          docker push ghcr.io/${{ github.repository }}:latest
          docker push ghcr.io/${{ github.repository }}:${{ github.sha }}
